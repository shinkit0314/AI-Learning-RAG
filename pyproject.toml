[project]
name = "ai-learning-rag"
version = "0.1.0"
description = "A beginner-friendly project for learning and building a RAG system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.139.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "onnxruntime>=1.31.0",
    "psycopg[binary]>=3.2,<4.0",
    "pymupdf>=1.28.2,<2.0.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=5.1.2,<6.0.0",
    "torch>=2.7.1,<2.15.0",
]
openai-generation = [
    "openai>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "ipykernel>=6.29,<8.0",
    "pip>=26.2.1",
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
